{% extends "base.html" %}

{% block content %}
<div class="card">
    <div class="card-title">Добавление учебного материала</div>
    
    <form method="POST">
        <div class="form-group">
            <label class="form-label">Название материала</label>
            <input type="text" name="title" class="form-control" required placeholder="Например: пластилин, краски, бумага">
        </div>
        
        <div class="form-group">
            <label class="form-label">Количество</label>
            <input type="number" name="quantity" class="form-control" min="1" required>
        </div>
        
        <button type="submit" class="btn btn-primary">Добавить</button>
        <a href="{{ url_for('main.index') }}" class="btn btn-outline">Отмена</a>
    </form>
</div>
{% endblock %}
