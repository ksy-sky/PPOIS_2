{% extends "base.html" %}

{% block content %}
<div class="card">
    <div class="card-title">Проведение учебного занятия</div>
    
    {% if not games %}
        <p class="alert alert-error">Нет учебных занятий. <a href="{{ url_for('main.add_game') }}">Добавьте занятие</a></p>
    {% else %}
        <form method="POST">
            <div class="form-group">
                <label class="form-label">Учебное занятие</label>
                <select name="game_name" class="form-control" required>
                    <option value="">-- Выберите занятие --</option>
                    {% for game in games %}
                        <option value="{{ game.name }}">
                            {{ game.name }} ({{ game.min_age }}-{{ game.max_age }} лет)
                            {% if game.required_materials %} — материалы: {{ game.required_materials|join(', ') }}{% endif %}
                        </option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="form-group">
                <label class="form-label">Группа (оставьте пустым для всех детей)</label>
                <select name="group_name" class="form-control">
                    <option value="">-- Все дети в саду --</option>
                    {% for group in groups %}
                        <option value="{{ group.name }}">{{ group.name }} ({{ group.get_count() }} детей)</option>
                    {% endfor %}
                </select>
            </div>
            
            <button type="submit" class="btn btn-primary">Начать занятие</button>
            <a href="{{ url_for('main.index') }}" class="btn btn-outline">Отмена</a>
        </form>
    {% endif %}
</div>
{% endblock %}
