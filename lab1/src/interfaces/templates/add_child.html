{% extends "base.html" %}

{% block content %}
<div class="card">
    <div class="card-title">Добавление ребенка</div>
    
    <form method="POST">
        <div class="form-group">
            <label class="form-label">Имя ребенка</label>
            <input type="text" name="name" class="form-control" required placeholder="Введите имя">
        </div>
        
        <div class="form-group">
            <label class="form-label">Возраст (1-7 лет)</label>
            <input type="number" name="age" class="form-control" min="1" max="7" required>
        </div>
        
        <div class="form-group">
            <label class="form-label">Группа (необязательно)</label>
            <select name="group_name" class="form-control">
                <option value="">-- Не определять --</option>
                {% for group in groups %}
                    <option value="{{ group.name }}">{{ group.name }} ({{ group.min_age }}-{{ group.max_age }} лет)</option>
                {% endfor %}
            </select>
        </div>
        
        <button type="submit" class="btn btn-primary">Добавить</button>
        <a href="{{ url_for('main.index') }}" class="btn btn-outline">Отмена</a>
    </form>
</div>
{% endblock %}
