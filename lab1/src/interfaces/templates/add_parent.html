{% extends "base.html" %}

{% block content %}
<div class="card">
    <div class="card-title">Добавление родителя</div>
    
    <form method="POST">
        <div class="form-group">
            <label class="form-label">Имя родителя</label>
            <input type="text" name="parent_name" class="form-control" required>
        </div>
        
        <div class="form-group">
            <label class="form-label">Ребенок</label>
            <select name="child_name" class="form-control" required>
                <option value="">-- Выберите ребенка --</option>
                {% for child in children %}
                    <option value="{{ child.name }}">{{ child.name }} ({{ child.age }} лет)</option>
                {% endfor %}
            </select>
        </div>
        
        <button type="submit" class="btn btn-primary">Добавить</button>
        <a href="{{ url_for('main.index') }}" class="btn btn-outline">Отмена</a>
    </form>
</div>
{% endblock %}
